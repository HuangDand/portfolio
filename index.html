<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人前端作品集</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Microsoft YaHei;
        }
        body{
            background:#f4f6f8;
            padding:30px;
        }
        .container{
            max-width:1100px;
            margin:0 auto;
        }
        h1{
            text-align:center;
            margin-bottom:40px;
            color:#2c3e50;
        }
        .project-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap:24px;
        }
        .card{
            background:#fff;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 2px 8px #ddd;
        }
        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }
        .card-body{
            padding:18px;
        }
        .card h3{
            margin-bottom:10px;
            color:#222;
        }
        .card p{
            color:#666;
            font-size:14px;
            margin-bottom:16px;
        }
        .link-group a{
            display:inline-block;
            padding:7px 14px;
            background:#2980b9;
            color:white;
            text-decoration:none;
            border-radius:4px;
            margin-right:8px;
            font-size:14px;
        }
        .link-group a:nth-child(2){
            background:#2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的前端作品集</h1>
        <div class="project-grid">
            <!--项目1 web菜单项目 -->
            <div class="card">
                <img src="images/proj1.png" alt="web项目截图">
                <div class="card-body">
                    <h3>Web菜单页面</h3>
                    <p>HTML+CSS+JS 菜单页面，侧边菜单搜索，页面切换</p>
                    <div class="link-group">
                        <a href="https://github.com/HuangDand/web" target="_blank">Github仓库</a>
                        <a href="https://web-huangdand.vercel.app" target="_blank">线上演示</a>
                    </div>
                </div>
            </div>
            <!--项目2 quizgame -->
            <div class="card">
                <img src="images/proj2.png" alt="quizgame项目截图">
                <div class="card-body">
                    <h3>QuizGame答题网页</h3>
                    <p>前端答题小游戏，JS实现题目切换与计分</p>
                    <div class="link-group">
                        <a href="https://github.com/HuangDand/quizgame" target="_blank">Github仓库</a>
                        <a href="https://quizgame-livid.vercel.app" target="_blank">线上演示</a>
                    </div>
                </div>
            </div>
            <!--项目3 menusearsh菜单搜索 -->
            <div class="card">
                <img src="images/proj3.png" alt="菜单搜索项目截图">
                <div class="card-body">
                    <h3>菜单搜索系统</h3>
                    <p>侧边栏菜单搜索，用户管理、商品列表，菜品图片展示</p>
                    <div class="link-group">
                        <a href="https://github.com/HuangDand/menusearsh" target="_blank">Github仓库</a>
                        <a href="https://menusearsh.vercel.app" target="_blank">线上演示</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
